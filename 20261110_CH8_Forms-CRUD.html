<!DOCTYPE html>
<html lang="zh-TW">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CH8-Forms-CRUD練習</title>

    <!-- CSS -->
    <link rel="stylesheet" href="css/bootstrap.min.css">
    <link rel="stylesheet" href="css/all.min.css">
    <link rel="stylesheet" href="css/myAllcss.css">

</head>

<body>

    <div class="container my-4">

        <!-- 標題 -->
        <div class="display-2 fw-bold text my-title-02">
            CH8-Forms-CRUD練習
        </div>

        <!-- ========================= -->
        <!-- 產品建檔表單 -->
        <!-- ========================= -->

        <div class="row justify-content-center" id="product-form">

            <div class="col-md-8 mt-3">

                <div class="card shadow">

                    <!-- Card Header -->
                    <div class="card-header bg-warning">

                        <div class="h2 fw-bold my-title-06 mb-0">
                            產品建檔
                        </div>

                    </div>

                    <!-- Card Body -->
                    <div class="card-body">

                        <!-- 產品名稱 -->
                        <div class="mb-3">

                            <label for="productname" class="form-label">
                                產品名稱
                            </label>

                            <input type="text" class="form-control" id="productname" placeholder="請輸入產品名稱（2-6個字）"
                                minlength="2" maxlength="6" required>

                            <div class="invalid-feedback">
                                產品名稱必須為 2～6 個字。
                            </div>

                        </div>

                        <!-- 價格 -->
                        <div class="mb-3">

                            <label for="price" class="form-label">
                                價格（1-200）
                            </label>

                            <div class="input-group">

                                <span class="input-group-text">
                                    $
                                </span>

                                <input type="number" min="1" max="200" step="1" value="1" class="form-control"
                                    id="price" required>

                                <span class="input-group-text">
                                    NT
                                </span>

                                <div class="invalid-feedback">
                                    價格必須為 1～200。
                                </div>

                            </div>

                        </div>

                        <!-- 商品數量 -->
                        <div class="mb-3">

                            <label for="range01" class="form-label">

                                數量：

                                <span id="rangeText" class="h2 text-danger fw-bold">
                                    50
                                </span>

                                個

                            </label>

                            <input type="range" class="form-range" min="1" max="100" step="1" value="50" id="range01">

                            <div class="d-flex justify-content-between">

                                <span class="text-secondary">1</span>

                                <span class="text-secondary">100</span>

                            </div>

                        </div>

                        <!-- 產品分類 -->
                        <div class="mb-3">

                            <label for="category" class="form-label">
                                產品分類
                            </label>

                            <select name="category" id="category" class="form-select" required>

                                <option value="" disabled selected>
                                    ---產品分類---
                                </option>

                                <option value="飲料">飲料</option>

                                <option value="咖啡">咖啡</option>

                                <option value="茶">茶</option>

                            </select>

                            <div class="invalid-feedback">
                                請選擇產品分類。
                            </div>

                            <div class="valid-feedback">
                                已選擇分類
                            </div>

                        </div>

                        <!-- 產品描述 -->
                        <div class="mb-3">

                            <label for="remark" class="form-label">
                                產品描述
                            </label>

                            <textarea name="remark" id="remark" class="form-control" rows="3"
                                placeholder="請輸入產品描述"></textarea>

                        </div>

                    </div>

                    <!-- Card Footer -->
                    <div class="card-footer text-end">

                        <button type="button" class="btn btn-outline-secondary" id="cancelBtn">

                            <i class="fa-solid fa-xmark me-1"></i>
                            取消

                        </button>

                        <button type="button" class="btn btn-primary" id="confirmBtn">

                            <i class="fa-solid fa-check me-1"></i>
                            確認

                        </button>

                    </div>

                </div>

            </div>

        </div>


        <!-- ========================= -->
        <!-- 產品資料確認畫面 -->
        <!-- ========================= -->

        <div class="my-5 d-none" id="show-msg">

            <!-- 標題 -->
            <div class="text-center mb-4">

                <div class="h1 fw-bold my-title-06">
                    產品建檔資料確認
                </div>

            </div>

            <!-- 資料確認卡片 -->
            <div class="row justify-content-center">

                <div class="col-lg-8 col-md-10">

                    <div class="card border-0 shadow rounded-4 overflow-hidden">

                        <!-- Card Header -->
                        <div class="card-header bg-warning py-3 px-4 border-0">

                            <div class="d-flex align-items-center">

                                <i class="fa-solid fa-box-open fa-2x me-3"></i>

                                <div>

                                    <div class="h4 fw-bold mb-0">
                                        產品資訊
                                    </div>

                                    <small class="text-dark">
                                        Product Information
                                    </small>

                                </div>

                            </div>

                        </div>

                        <!-- Card Body -->
                        <div class="card-body p-4">

                            <!-- JavaScript 動態產生資料 -->
                            <div class="row g-3" id="showmsg">

                            </div>

                        </div>

                        <!-- Card Footer -->
                        <div class="card-footer bg-white border-0 px-4 pb-4">

                            <hr class="text-secondary opacity-25">

                            <div class="d-flex justify-content-between align-items-center flex-wrap gap-2">

                                <small class="text-secondary">

                                    <i class="fa-solid fa-circle-info me-1"></i>
                                    請再次確認產品資料

                                </small>

                                <div class="d-flex gap-2">

                                    <button type="button" class="btn btn-outline-secondary px-4" id="reviewCancelBtn">

                                        <i class="fa-solid fa-xmark me-1"></i>
                                        返回修改

                                    </button>

                                    <button type="button" class="btn btn-primary px-4" id="OK-Btn">

                                        <i class="fa-solid fa-check me-1"></i>
                                        確認送出

                                    </button>

                                </div>

                            </div>

                        </div>

                    </div>

                </div>

            </div>

        </div>

    </div>


    <!-- ========================= -->
    <!-- JavaScript -->
    <!-- ========================= -->

    <script src="js/bootstrap.bundle.min.js"></script>
    <script src="js/jquery-4.0.0.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>


    <script>

        // =========================
        // 全域變數
        // =========================

        let flag_pname = false;
        let flag_price = false;
        let flag_category = false;
        let flag_remark = true;


        // =========================
        // jQuery 初始化
        // =========================

        $(function () {


            // =========================
            // 產品名稱驗證
            // =========================

            $("#productname").on("input change", function () {

                let pname = $(this).val().trim();

                if (pname.length >= 2 && pname.length <= 6) {

                    $(this).removeClass("is-invalid");
                    $(this).addClass("is-valid");

                    flag_pname = true;

                } else {

                    $(this).removeClass("is-valid");
                    $(this).addClass("is-invalid");

                    flag_pname = false;

                }

            });


            // =========================
            // 價格驗證
            // =========================

            $("#price").on("input change", function () {

                let price = Number($(this).val());

                if (
                    $(this).val() !== "" &&
                    Number.isInteger(price) &&
                    price >= 1 &&
                    price <= 200
                ) {

                    $(this).removeClass("is-invalid");
                    $(this).addClass("is-valid");

                    flag_price = true;

                } else {

                    $(this).removeClass("is-valid");
                    $(this).addClass("is-invalid");

                    flag_price = false;

                }

            });


            // =========================
            // 數量滑桿
            // =========================

            $("#range01").on("input", function () {

                let quantity = $(this).val();

                $("#rangeText").text(quantity);

            });


            // =========================
            // 產品分類驗證
            // =========================

            $("#category").on("change", function () {

                if ($(this).val() !== "") {

                    $(this).removeClass("is-invalid");
                    $(this).addClass("is-valid");

                    flag_category = true;

                } else {

                    $(this).removeClass("is-valid");
                    $(this).addClass("is-invalid");

                    flag_category = false;

                }

            });


            // =========================
            // 產品描述
            // =========================

            $("#remark").on("input change", function () {

                let remark = $(this).val().trim();

                // 產品描述為選填
                if (remark.length === 0) {

                    $(this).removeClass("is-valid is-invalid");

                    flag_remark = true;

                } else {

                    $(this).removeClass("is-invalid");
                    $(this).addClass("is-valid");

                    flag_remark = true;

                }

            });


            // =========================
            // HTML 特殊字元處理
            // =========================

            function escapeHTML(value) {

                return $("<div>").text(value).html();

            }


            // =========================
            // 確認按鈕
            // =========================

            $("#confirmBtn").on("click", function () {

                // 重新執行欄位驗證
                $("#productname").trigger("input");
                $("#price").trigger("input");
                $("#category").trigger("change");

                if (
                    flag_pname &&
                    flag_price &&
                    flag_category &&
                    flag_remark
                ) {

                    // 取得表單資料
                    const pname = $("#productname").val().trim();
                    const price = $("#price").val();
                    const range01 = $("#range01").val();
                    const category = $("#category").val();
                    const remark = $("#remark").val().trim();

                    // 避免輸入內容被當成 HTML
                    const safeName = escapeHTML(pname);
                    const safeRemark = escapeHTML(remark);

                    // =========================
                    // 組合 HTML
                    // =========================

                    let strHTML = `

                        <div class="col-md-6">

                            <div class="p-3 bg-light rounded-3 h-100">

                                <div class="text-secondary small mb-2">
                                    <i class="fa-solid fa-tag me-2"></i>
                                    產品名稱
                                </div>

                                <div class="h5 fw-bold mb-0">
                                    ${safeName}
                                </div>

                            </div>

                        </div>


                        <div class="col-md-6">

                            <div class="p-3 bg-light rounded-3 h-100">

                                <div class="text-secondary small mb-2">
                                    <i class="fa-solid fa-dollar-sign me-2"></i>
                                    產品價格
                                </div>

                                <div class="h5 fw-bold text-danger mb-0">
                                    NT$ ${Number(price)}
                                </div>

                            </div>

                        </div>


                        <div class="col-md-6">

                            <div class="p-3 bg-light rounded-3 h-100">

                                <div class="text-secondary small mb-2">
                                    <i class="fa-solid fa-cubes me-2"></i>
                                    庫存數量
                                </div>

                                <div class="h5 fw-bold mb-0">
                                    ${Number(range01)} 個
                                </div>

                            </div>

                        </div>


                        <div class="col-md-6">

                            <div class="p-3 bg-light rounded-3 h-100">

                                <div class="text-secondary small mb-2">
                                    <i class="fa-solid fa-layer-group me-2"></i>
                                    產品分類
                                </div>

                                <div class="h5 fw-bold mb-0">
                                    ${escapeHTML(category)}
                                </div>

                            </div>

                        </div>


                        <div class="col-12">

                            <div class="p-3 bg-light rounded-3">

                                <div class="text-secondary small mb-2">
                                    <i class="fa-solid fa-comment-dots me-2"></i>
                                    產品描述
                                </div>

                                <div class="mb-0">
                                    ${safeRemark || "無產品描述"}
                                </div>

                            </div>

                        </div>

                    `;


                    // =========================
                    // 顯示產品資料
                    // =========================

                    $("#showmsg").html(strHTML);


                    // 顯示產品資料確認畫面
                    $("#show-msg").removeClass("d-none");

                } else {

                    // 欄位錯誤提示
                    Swal.fire({

                        icon: "error",
                        title: "欄位錯誤!",
                        text: "欄位錯誤，請修正!"

                    });

                }

            });


            // =========================
            // 返回修改
            // =========================

            $("#reviewCancelBtn").on("click", function () {

                // 隱藏資料確認畫面
                $("#show-msg").addClass("d-none");

                // 顯示產品建檔表單
                $("#product-form").removeClass("d-none");

            });


            // =========================
            // 取消建檔
            // =========================

            $("#cancelBtn").on("click", function () {

                // 清空表單
                $("#productname").val("");
                $("#price").val(1);
                $("#range01").val(50);
                $("#rangeText").text(50);
                $("#category").val("");
                $("#remark").val("");

                // 移除驗證樣式
                $("#productname, #price, #category, #remark")
                    .removeClass("is-valid is-invalid");

                // 重設驗證旗標
                flag_pname = false;
                flag_price = false;
                flag_category = false;
                flag_remark = true;

            });


            // =========================
            // 確認送出
            // =========================

            $("#OK-Btn").on("click", function () {

                // 蒐集欄位資料
                const pname = $("#productname").val().trim();
                const price = $("#price").val();
                const range01 = $("#range01").val();
                const category = $("#category").val();
                const remark = $("#remark").val().trim();


                // 轉成 JSON 物件
                const dataJSON = {

                    "name": pname,
                    "category": category,
                    "price": Number(price),
                    "stock": Number(range01),
                    "description": remark

                };


                // 顯示 JSON 資料
                console.log(dataJSON);


                //傳送資料至後端API，執行新增動作
                $.ajax({
                    type: "POST",
                    url: "http://localhost:3000/product",
                    dataType: "json",
                    data: JSON.stringify(dataJSON),
                    contentType: "application/json",
                    success: function (data) {
                        Swal.fire({

                            title: "新增成功！",

                            text: "產品資料已成功新增。",

                            icon: "success",

                            confirmButtonText: "確定"

                        })

                    },
                    error: function () {
                        Swal.fire({
                            title: "新增失敗",
                            text: "無法連接後端API。",
                            icon: "error"
                        });
                    }
                });


            });


        });

    </script>

</body>

</html>
