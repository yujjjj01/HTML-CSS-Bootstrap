<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CH8-Forms-CRUD練習</title>

    <!-- CSS -->
    <link rel="stylesheet" href="CSS/bootstrap.min.css">
    <link rel="stylesheet" href="CSS/all.min.css">
    <link rel="stylesheet" href="CSS/ERP-product.css">

</head>

<body>

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg bg-body-tertiary">
        <div class="container-fluid">

            <a class="navbar-brand" href="#">
                <i class="fa-solid fa-cubes-stacked me-2"></i>
                CRUD練習
            </a>

            <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false"
                aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navbarSupportedContent">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0">

                    <li class="nav-item">
                        <a class="nav-link" aria-current="page" href="#">
                            <i class="fa-solid fa-house me-1"></i>
                            首頁
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="20261110_CH8_Forms-CRUD-C-AI.html">
                            <i class="fa-solid fa-square-plus me-1"></i>
                            產品建檔
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link active" href="20261110_CH8_Forms-CRUD-R-AI.html">
                            <i class="fa-solid fa-list me-1"></i>
                            產品列表
                        </a>
                    </li>

                </ul>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <div class="container">
        <div class="row">
            <div class="col-12">

                <div class="card mt-4">

                    <div class="card-header fw-bold my-title-02">
                        <div>
                            <div class="d-flex align-items-center gap-2">
                                <i class="fa-solid fa-boxes-stacked"></i>
                                產品列表
                            </div>
                        </div>
                    </div>

                    <div class="card-body">

                        <!-- Table Heading -->
                        <div class="d-flex justify-content-between align-items-center flex-wrap gap-2 mb-3">

                            <div>
                                <p class="text-muted mb-0">
                                    查看目前系統中的產品資訊
                                </p>
                            </div>

                        </div>

                        <div class="table-responsive">
                            <table class="table table-bordered table-rwd align-middle">
                                <thead class="table-dark">
                                    <tr>
                                        <th width="10%">產品名稱</th>
                                        <th width="25%">產品價格</th>
                                        <th width="20%">產品數量</th>
                                        <th width="10%">產品分類</th>
                                        <th width="10%">產品備註</th>
                                    </tr>
                                </thead>

                                <tbody id="mytbody">
                                    <tr>
                                        <td data-th="產品名稱">xxxx</td>
                                        <td data-th="產品價格">xxxx</td>
                                        <td data-th="產品數量">xxxx</td>
                                        <td data-th="產品分類">xxxx</td>
                                        <td data-th="產品備註">xxxx</td>
                                    </tr>
                                </tbody>

                            </table>
                        </div>

                    </div>
                </div>

            </div>
        </div>
    </div>

    <script src="js/bootstrap.bundle.min.js"></script>
    <script src="js/jquery-4.0.0.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <script>
        $(function () {
            $.ajax({
                type: "GET",
                url: "http://localhost:3000/product",
                dataType: "json",
                success: showdata,
                error: function () {
                    Swal.fire({
                        title: "讀取失敗",
                        text: "無法連接後端API",
                        icon: "error"
                    });
                }

            });
        });

        function showdata(data) {
            console.log(data)
            $("#mytbody").empty();
            data.forEach(function (item) {
                console.log(item.name);

                const strHTML = `<tr>
                                    <td data-th="產品名稱">${item.name}</td>
                                    <td data-th="產品價格">${item.price}</td>
                                    <td data-th="產品數量">${item.stock}</td>
                                    <td data-th="產品分類">${item.category}</td>
                                    <td data-th="產品備註">${item.description}</td>
                                </tr>`;
                $("#mytbody").append(strHTML);

            })
        }
    </script>

</body>

</html>
