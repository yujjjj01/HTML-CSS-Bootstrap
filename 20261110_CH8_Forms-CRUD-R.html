<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CH8-Forms-CRUD練習</title>

    <!-- CSS -->
    <link rel="stylesheet" href="CSS/bootstrap.min.css">
    <link rel="stylesheet" href="CSS/all.min.css">
    <link rel="stylesheet" href="CSS/myAllcss.css">

    <style>
        @media screen and (max-width:768px) {
            .table-rwd thead {
                display: none;
            }

            .table-rwd tbody tr {
                display: block;
                border: 3px solid var(--my-border-color);
                margin-top: 15px;
            }

            .table-rwd tbody tr td {
                display: block;
                overflow: hidden;
            }

            .table-rwd tbody tr td::before {
                content: attr(data-th) ":";
                font-family: "LXGW WenKai Mono TC";
                font-size: 23px;
                font-weight: 900;
                display: block;
                float: left;
                width: 30%;
                text-align: right;
                padding-right: 20px;
                color: var(--my-content-heading-color);
            }

            .table-rwd tbody tr td span {
                display: block;
                float: left;
                width: 70%;
                font-family: "LXGW WenKai Mono TC";
                color: var(--my-content-text-color);
                font-size: 20px;
                font-weight: 700;
            }
        }
    </style>
</head>

<body>

    <nav class="navbar navbar-expand-lg bg-body-tertiary">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">CRUD練習</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false"
                aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarSupportedContent">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                    <li class="nav-item">
                        <a class="nav-link " aria-current="page" href="#">首頁</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link " href="20261110_CH8_Forms-CRUD-C.html">產品建檔</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link active" href="20261110_CH8_Forms-CRUD-R.html">產品列表</a>
                    </li>

                </ul>
            </div>
        </div>
    </nav>

    <div class="container">
        <div class="row">
            <div class="col-12">
                <div class="card mt-4">
                    <div class="card-header fw-bold my-title-02">
                        產品列表
                    </div>
                    <div class="card-body">

                        <!-- 表格 -->
                        <table class="table table-bordered table-rwd">
                            <thead class="table-dark">
                                <tr>
                                    <th width="15%">產品名稱</th>
                                    <th width="15%">產品價格</th>
                                    <th width="15%">產品數量</th>
                                    <th width="15%">產品分類</th>
                                    <th width="15%">產品備註</th>
                                    <th width="15%">功能</th>
                                </tr>
                            </thead>
                            <tbody id="mytbody">
                                <tr>
                                    <td data-th="產品名稱">xxxx</td>
                                    <td data-th="產品價格">xxxx</td>
                                    <td data-th="產品數量">xxxx</td>
                                    <td data-th="產品分類">xxxx</td>
                                    <td data-th="產品備註">xxxx</td>
                                    <td data-th="功能">xxxxx</td>

                                    <td>
                                        <button class="btn btn-warning" data-bs-target="#updateModal"
                                            data-bs-toggle="modal">更新</button>
                                        <button class="btn btn-danger">刪除</button>
                                    </td>
                                </tr>
                            </tbody>
                        </table>

                        <!-- 頁碼 -->
                        <nav aria-label="Page navigation example">
                            <ul class="pagination justify-content-center" id="pageList">
                                <li class="page-item"><a class="page-link" href="#">Previous</a></li>
                                <li class="page-item"><a class="page-link" href="#">1</a></li>
                                <li class="page-item"><a class="page-link" href="#">2</a></li>
                                <li class="page-item"><a class="page-link" href="#">3</a></li>
                                <li class="page-item"><a class="page-link" href="#">Next</a></li>
                            </ul>
                        </nav>

                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal -->
    <div class="modal fade" id="updateModal" tabindex="-1" aria-labelledby="exampleModalLabel" aria-hidden="true"
        data-bs-backdrop="static">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header text-bg-warning">
                    <h1 class="modal-title fs-5" id="exampleModalLabel">產品更新</h1>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>

                <!-- modal中間內容 -->
                <div class="modal-body">
                    <!-- 產品名稱 -->
                    <div class="mb-3">

                        <label for="productname" class="form-label">
                            產品名稱
                        </label>

                        <input type="text" class="form-control" id="productname" value="汽水" minlength="2" maxlength="6"
                            disabled>

                        <div class="invalid-feedback">
                            產品名稱必須為 2～6 個字。
                        </div>

                    </div>

                    <!-- 價格 -->
                    <div class="mb-3">

                        <label for="price" class="form-label">
                            價格（1-200）
                        </label>

                        <div class="input-group">

                            <span class="input-group-text">
                                $
                            </span>

                            <input type="number" min="1" max="200" step="1" value="1" class="form-control" id="price"
                                required>

                            <span class="input-group-text">
                                NT
                            </span>

                            <div class="valid-feedback">價格符合規定</div>

                            <div class="invalid-feedback">價格不符合規定</div>

                        </div>

                    </div>

                    <!-- 商品數量 -->
                    <div class="mb-3">

                        <label for="range01" class="form-label">

                            數量：

                            <span id="rangeText" class="h2 text-danger fw-bold">
                                50
                            </span>

                            個

                        </label>

                        <input type="range" class="form-range" min="1" max="100" step="1" value="50" id="range01">

                        <div class="d-flex justify-content-between">

                            <span class="text-secondary">1</span>

                            <span class="text-secondary">100</span>

                        </div>

                    </div>

                    <!-- 產品分類 -->
                    <div class="mb-3">

                        <label for="category" class="form-label">
                            產品分類
                        </label>

                        <select name="category" id="category" class="form-select" required>

                            <option value="" disabled selected>
                                ---產品分類---
                            </option>

                            <option value="飲料" selected>飲料</option>

                            <option value="咖啡">咖啡</option>

                            <option value="茶">茶</option>

                        </select>

                    </div>

                    <!-- 產品描述 -->
                    <div class="mb-3">

                        <label for="remark" class="form-label">
                            產品描述
                        </label>

                        <textarea disabled name="remark" id="remark" class="form-control" rows="3">清涼消暑的碳酸飲料</textarea>

                    </div>

                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">取消</button>
                        <button type="button" class="btn btn-primary" id="updateModal-btn-update">確認更新</button>
                    </div>

                </div>
            </div>

        </div>
    </div>

    <script src="js/bootstrap.bundle.min.js"></script>
    <script src="js/jquery-4.0.0.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <script>
        const pageSize = 6;
        let page = 1;
        let productData = [];
        let flag_price = true;
        let uid = "";

        $(function () {
            $.ajax({
                type: "GET",
                url: "http://localhost:3000/product",
                dataType: "json",
                success: showdata,
                error: function () {
                    Swal.fire({
                        title: "讀取失敗",
                        text: "無法連接後端API",
                        icon: "error"
                    });
                }

            });

            //監聽點擊頁碼
            $("#pageList").on("click", ".page-link", function () {

                page = Number($(this).data("page"));

                //重新顯示畫面
                showdata(productData);
            });

            //監聽更新按鈕
            $("#mytbody").on("click", ".btn-update", function () {
                console.log($(this).data("id"));
                const id = $(this).data("id");
                uid = $(this).data("id");

                //傳遞至後端API 取得資料
                $.ajax({
                    type: "GET",
                    url: "http://localhost:3000/product/" + id,
                    dataType: "json",
                    success: showUpdateData,
                    error: function () {
                        Swal.fire({
                            title: "讀取失敗",
                            text: "無法連接後端API",
                            icon: "error"
                        });
                    }
                });
            });

            // 監聽數量滑桿
            $("#range01").on("input", function () {

                $("#rangeText").text($(this).val());

            });

            //監聽價格
            $("#price").on("change", function () {

                const price = Number($(this).val());
                if (price >= 1 && price <= 200) {
                    $(this).removeClass("is-invalid");
                    $(this).addClass("is-valid");
                    flag_price = true;
                } else {
                    $(this).removeClass("is-valid");
                    $(this).addClass("is-invalid");
                    flag_price = false;
                }

            });

            //監聽確認更新按鈕 #updateModal-btn-update
            $("#updateModal-btn-update").on("click", function () {
                if (!flag_price) {
                    Swal.fire({
                        title: "更新失敗",
                        text: "價格欄位錯誤!",
                        icon: "error"
                    });

                    return;
                }

                //取得表單資料
                const price = Number($("#price").val());
                const stock = Number($("#range01").val());

                //轉換json格式傳遞至後端，執行更新步驟
                const jsonData = {
                    price: price,
                    stock: stock
                }

                console.log(JSON.stringify(jsonData));

                $.ajax({
                    type: "PATCH",
                    url: "http://localhost:3000/product/" + uid,
                    dataType: "json",
                    data: JSON.stringify(jsonData),
                    contentType: "application/json",
                    success: function (data) {
                        console.log("更新成功:", data);
                        //關閉modal
                        bootstrap.Modal.getInstance(document.getElementById("updateModal")).hide();

                        Swal.fire({
                            title: "更新成功",
                            text: "產品資料已更新!",
                            icon: "success"
                        });

                        //重新取得產品列表
                        $.ajax({
                            type: "GET",
                            url: "http://localhost:3000/product/",
                            dataType: "json",
                            success: showdata
                        });

                    },
                    error: function () {
                        Swal.fire({
                            title: "更新失敗",
                            text: "無法更新產品資料!",
                            icon: "error"
                        });
                    }
                });

            });

            //監聽刪除按鈕
            $("#mytbody").on("click", ".btn-delete", function () {
                console.log($(this).data("id"));
                const did = $(this).data("id");

                //詢問確認是否刪除
                Swal.fire({
                    title: "確認要刪除嗎?",
                    showDenyButton: true,
                    showCancelButton: false,
                    confirmButtonText: "確認",
                    denyButtonText: `取消`,
                    icon: "warning"
                }).then((result) => {
                    /* Read more about isConfirmed, isDenied below */
                    if (result.isConfirmed) {
                        //傳送did 至後端API執行刪除
                        $.ajax({
                            type: "DELETE",
                            url: "http://localhost:3000/product/" + did,
                            dataType: "json",
                            success: function (data) {
                                console.log(data);

                                Swal.fire({
                                    title: "刪除成功",
                                    text: "該筆資料已被刪除",
                                    icon: "success"
                                })

                                //重新取得產品列表
                                $.ajax({
                                    type: "GET",
                                    url: "http://localhost:3000/product/",
                                    dataType: "json",
                                    success: function (data) {
                                        //避免刪除後導致頁碼錯誤
                                        const totalPage = Math.ceil(data.length / pageSize);

                                        if (page > totalPage) {
                                            page = Math.max(1, totalPage)
                                        }
                                        showdata(data);
                                    }
                                });

                            },
                            error: function () {
                                Swal.fire({
                                    title: "刪除失敗",
                                    text: "無法刪除產品資料!",
                                    icon: "error"
                                })
                            }
                        });
                    }
                    else if (result.isDenied) Swal.fire("放棄刪除", "", "info");
                });


            });
        });


        function showdata(data) {
            console.log(data);
            productData = data;

            //分頁
            const pageData = pagination(data, pageSize, page);

            $("#mytbody").empty();
            pageData.forEach(function (item) {
                const strHTML = `<tr>
                                    <td data-th="產品名稱">${item.name}</td>
                                    <td data-th="產品價格">${item.price}</td>
                                    <td data-th="產品數量">${item.stock}</td>
                                    <td data-th="產品分類">${item.category}</td>
                                    <td data-th="產品備註">${item.description}</td>
                                    <td data-th="功能">
                                        <button class="btn btn-warning btn-update" data-bs-target="#updateModal"
                                            data-bs-toggle="modal" data-id="${item.id}">更新</button>
                                        <button class="btn btn-danger btn-delete" data-id="${item.id}">刪除</button>
                                    </td>
                                </tr>`;
                $("#mytbody").append(strHTML);

            });

            //產生頁碼
            const totalPage = Math.ceil(data.length / pageSize);
            $("#pageList").empty();

            //上一頁
            if (page > 1) {
                $("#pageList").append(`<li class="page-item"><a class="page-link" href="#" data-page="${page - 1}">上一頁</a></li>`);
            }


            //頁碼
            for (let i = 1; i <= totalPage; i++) {

                let active = (i === page) ? "active" : "";

                let strHTML = `<li class="page-item ${active}"><a class="page-link" href="#" data-page="${i}">${i}</a></li>`;
                $("#pageList").append(strHTML);
            }

            //下一頁
            if (page < totalPage) {
                $("#pageList").append(`<li class="page-item"><a class="page-link" href="#" data-page="${page + 1}">下一頁</a></li>`);
            }

        }


        //更新modal的資料導入
        function showUpdateData(data) {

            //將資料放入updatmodal
            $("#productname").val(data.name);
            $("#price").val(data.price);
            $("#range01").val(data.stock);
            // 同步更新數量文字
            $("#rangeText").text(data.stock);
            $("#category").val(data.category);
            $("#remark").val(data.description);
        }


        //分頁副程式
        function pagination(data, pageSize, page) {
            const start = (page - 1) * pageSize;
            const end = start + pageSize;

            return data.slice(start, end);

        }

    </script>

</body>

</html>
