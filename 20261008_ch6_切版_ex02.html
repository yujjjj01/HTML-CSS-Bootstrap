<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>切版練習_ex02</title>


    <link rel="stylesheet" href="CSS/bootstrap.min.css">
    <link rel="stylesheet" href="CSS/myAllcss.css">


    <style>
        .box01 {
            height: 200px;
            background-image: url(images/Nature.avif);
        }

        .box02 {
            height: 120px;
            line-height: 120px;
        }

        .box03 {
            border: 1px solid #ccc;
            padding: 5px;
            border-radius: 5px;
            box-shadow: 2px 2px 2px 2px #8b8b8b;
        }

        @media screen and (min-width:992px) {
            .box02 {
                width: 180px;
                height: 180px;
                line-height: 180px;
                border-radius: 50%;

            }

        }

        @media screen and (min-width:1200px) {

            .box02 {
                width: 220px;
                height: 220px;
                line-height: 220px;
                border-radius: 50%;

            }
        }
    </style>

</head>

<body>

    <script src="js/bootstrap.bundle.min.js"></script>
    <script src="js/jquery-4.0.0.js"></script>


    <div class="container">

        <!--1 圖片-->
        <div class="row">
            <div class="col-12 mt-3 d-none d-sm-block">
                <div class="box01 my-bg-img"></div>
            </div>
        </div>

        <!--2 選單-->
        <div class="row">

            <div class="col-sm-6 col-md-3 mt-3">
                <div class="box02 bg-success fs-1 fw-bold text-black text-center my-font">選單01</div>
            </div>

            <div class="col-sm-6 col-md-3 mt-3">
                <div class="box02 bg-success fs-1 fw-bold text-black text-center my-font">選單02</div>
            </div>

            <div class="col-sm-6 col-md-3 mt-3">
                <div class="box02 bg-success fs-1 fw-bold text-black text-center my-font">選單03</div>
            </div>

            <div class="col-sm-6 col-md-3 mt-3">
                <div class="box02 bg-success fs-1 fw-bold text-black text-center my-font">選單04</div>
            </div>

        </div>

        <!-- 3 圖片+標題+內文 -->
        <div class="row" id="travelfood_list">

            <div class="col-md-6 col-lg-4
            mt-3">
                <div class="box03">

                    <img src="images/tree.avif" class="img-fluid" alt="">

                    <div class="h3 my-font fw-bold text-center mt-3">景點標題01</div>
                    <div class="h3 my-font">地址:xxxx</div>
                    <div class="h3 my-font ">電話:xxxx</div>
                    <div class="h3 my-font">簡介:xxxx</div>
                </div>
            </div>
        </div>

        <!-- 4 footer -->
        <div class="row">
            <div class="col-12  d-none d-md-block my-footer my-font h4 text-end">
                Power By xxx 2026.10.08
            </div>
        </div>

    </div>

    <script>
        $(function () {
            //介接資料
            $.ajax({
                type: "GET",
                url: "http://localhost:3000/travelfood",
                dataType: "json",
                success: showdata,
                error: function () {
                    console.log("介接失敗");
                    alert("介接失敗");
                }
            });

        });

        function showdata(data) {
            console.log(data);
            $("#travelfood_list").empty();

            data.forEach(function (item) {

                const strHTML = `<div class="col-md-6 col-lg-4 mt-3">
                                    <div class="box03">
                                        <img src="images/tree.avif" class="img-fluid" alt="">
                                        <div class="h1 my-font fw-bold text-center my-title-06 mt-3">${item.Name}</div>
                                        <div class="h4 my-font my-h2">地址:${item.City}${item.Town}${item.Address}</div>
                                        <div class="h4 my-font my-h2">電話:${item.Tel}</div>
                                        <div class="h4 my-font my-h2 my-intro-text">簡介:${item.HostWords}</div>
                                    </div>
                                </div>`;

            $("#travelfood_list").append(strHTML);

            });
        }
    </script>
</body>

</html>
